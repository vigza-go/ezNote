<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>轻记 - 轻量协同笔记</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="manifest" href="/manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="轻记">
    <link rel="apple-touch-icon" href="/favicon.svg">
    <meta name="theme-color" content="#4a90d9">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root, [data-theme="light"] {
            --bg-primary: #fafafa;
            --bg-secondary: #ffffff;
            --bg-hover: #f0f0f0;
            --bg-active: #e3f2fd;
            --text-primary: #1a1a1a;
            --text-secondary: #555;
            --text-muted: #999;
            --border-color: #e5e5e5;
            --accent-color: #4a90d9;
            --accent-hover: #3a7bc8;
            --danger-color: #e74c3c;
            --success-color: #2e9e5b;
            --checkbox-border: #c4c4c4;
            /* 一周七天的颜色：周日红 → 周六紫 */
            --wd-0: #d9483f;
            --wd-1: #c2691c;
            --wd-2: #a8880a;
            --wd-3: #2f8a4e;
            --wd-4: #16878f;
            --wd-5: #2f6fd0;
            --wd-6: #8a52c8;
            --toolbar-bg: #fff;
            --toolbar-border: #e0e0e0;
            --toolbar-shadow: rgba(0,0,0,0.08);
            --code-bg: #f5f5f5;
            --blockquote-border: #ddd;
            --blockquote-bg: #f9f9f9;
            --selection-bg: #b4d5fe;
            --cursor-glow: rgba(74,144,217,0.3);
        }

        [data-theme="dark"] {
            --bg-primary: #1e1e1e;
            --bg-secondary: #252526;
            --bg-hover: #2a2d2e;
            --bg-active: #094771;
            --text-primary: #d4d4d4;
            --text-secondary: #cccccc;
            --text-muted: #858585;
            --border-color: #3c3c3c;
            --accent-color: #007acc;
            --accent-hover: #0066aa;
            --danger-color: #f14c4c;
            --success-color: #4ec9b0;
            --checkbox-border: #6a6a6a;
            --wd-0: #f0756c;
            --wd-1: #e39a4e;
            --wd-2: #d4bd4a;
            --wd-3: #63c07f;
            --wd-4: #4cb3bb;
            --wd-5: #6f9de8;
            --wd-6: #b08ae0;
            --toolbar-bg: #2d2d2d;
            --toolbar-border: #3c3c3c;
            --toolbar-shadow: rgba(0,0,0,0.3);
            --code-bg: #1e1e1e;
            --blockquote-border: #4a4a4a;
            --blockquote-bg: #252526;
            --selection-bg: #094771;
            --cursor-glow: rgba(0,122,204,0.3);
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Noto Sans SC', sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            height: 100vh;
            overflow: hidden;
            transition: background 0.3s, color 0.3s;
        }

        ::selection { background: var(--selection-bg); }

        .app { display: flex; height: 100vh; }

        .sidebar {
            width: 280px;
            background: var(--bg-secondary);
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
            transition: background 0.3s, border-color 0.3s;
        }

        .sidebar-header {
            padding: 16px 20px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .app-title {
            font-size: 18px;
            font-weight: 700;
            color: var(--text-primary);
            letter-spacing: -0.5px;
        }

        .dark-toggle {
            background: none;
            border: none;
            font-size: 18px;
            cursor: pointer;
            padding: 4px 8px;
            border-radius: 6px;
            transition: background 0.2s;
        }
        .dark-toggle:hover { background: var(--bg-hover); }

        .sidebar-actions { padding: 12px 20px; }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            padding: 10px 16px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.2s ease;
            width: 100%;
        }

        .btn-primary {
            background: var(--accent-color);
            color: white;
        }
        .btn-primary:hover { background: var(--accent-hover); }

        .notes-list {
            flex: 1;
            overflow-y: auto;
            padding: 8px;
        }

        .note-item {
            padding: 12px 14px;
            border-radius: 8px;
            cursor: pointer;
            margin-bottom: 2px;
            transition: background 0.15s ease;
        }
        .note-item:hover { background: var(--bg-hover); }
        .note-item.active { background: var(--bg-active); }

        .note-item-title {
            font-size: 14px;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 3px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .note-item-date {
            font-size: 11px;
            color: var(--text-muted);
        }

        .note-item-preview {
            font-size: 12px;
            color: var(--text-secondary);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            margin-top: 4px;
        }

        .editor-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: var(--bg-secondary);
            overflow: hidden;
            transition: background 0.3s;
        }

        /* ===== 视图切换（笔记 / 日报） ===== */
        .view-switch {
            display: flex;
            gap: 4px;
            padding: 10px 16px;
            border-bottom: 1px solid var(--border-color);
        }

        .view-switch-btn {
            flex: 1;
            padding: 8px 10px;
            border: none;
            border-radius: 7px;
            background: none;
            color: var(--text-secondary);
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            transition: background 0.15s, color 0.15s;
        }
        .view-switch-btn:hover { background: var(--bg-hover); }
        .view-switch-btn.active {
            background: var(--accent-color);
            color: #fff;
        }

        .sidebar-pane { display: flex; flex-direction: column; flex: 1; overflow: hidden; }
        .sidebar-pane.hidden { display: none; }

        .sidebar-subtitle {
            padding: 4px 20px 8px;
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 0.3px;
            color: var(--text-muted);
        }

        .daily-date-list {
            flex: 1;
            overflow-y: auto;
            padding: 0 10px 16px;
        }

        .daily-date-item {
            padding: 8px 10px;
            border-radius: 7px;
            cursor: pointer;
            display: flex;
            align-items: baseline;
            gap: 8px;
            transition: background 0.12s;
        }
        .daily-date-item:hover { background: var(--bg-hover); }
        .daily-date-item.active { background: var(--bg-active); }
        .daily-date-item .dd-date {
            font-size: 13px;
            font-weight: 600;
            color: var(--text-primary);
        }
        .daily-date-item .dd-weekday {
            font-size: 11px;
            font-weight: 600;
        }
        .daily-date-item .dd-count {
            margin-left: auto;
            font-size: 11px;
            color: var(--text-muted);
        }
        .daily-date-empty {
            padding: 24px 14px;
            font-size: 12px;
            color: var(--text-muted);
            text-align: center;
            line-height: 1.7;
        }

        /* ===== 日报 ===== */
        .daily-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: var(--bg-secondary);
            overflow: hidden;
            transition: background 0.3s;
        }
        .daily-container.hidden { display: none; }
        .daily-container .hidden { display: none; }

        .daily-header {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 12px 20px;
            border-bottom: 1px solid var(--border-color);
            flex-wrap: wrap;
        }

        .daily-nav {
            display: flex;
            align-items: center;
            gap: 2px;
        }

        .daily-nav-btn {
            width: 30px;
            height: 30px;
            border: none;
            border-radius: 7px;
            background: none;
            color: var(--text-secondary);
            font-size: 16px;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            transition: background 0.15s;
        }
        .daily-nav-btn:hover { background: var(--bg-hover); }

        /* 星期几着色 */
        .wd-0 { color: var(--wd-0); }
        .wd-1 { color: var(--wd-1); }
        .wd-2 { color: var(--wd-2); }
        .wd-3 { color: var(--wd-3); }
        .wd-4 { color: var(--wd-4); }
        .wd-5 { color: var(--wd-5); }
        .wd-6 { color: var(--wd-6); }

        .today-badge {
            display: inline-block;
            margin-left: 2px;
            padding: 1px 7px;
            border-radius: 20px;
            background: var(--bg-active);
            color: var(--accent-color);
            font-size: 11px;
            font-weight: 600;
            vertical-align: 2px;
        }

        .daily-back-btn {
            display: none;
            align-items: center;
            justify-content: center;
            width: 30px;
            height: 30px;
            border: none;
            border-radius: 7px;
            background: none;
            color: var(--text-secondary);
            cursor: pointer;
            flex-shrink: 0;
        }
        .daily-back-btn:hover { background: var(--bg-hover); }

        .daily-date-title {
            font-size: 17px;
            font-weight: 700;
            color: var(--text-primary);
            min-width: 190px;
            padding: 0 4px;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .wd-label { font-weight: 700; }

        .daily-date-picker {
            border: 1px solid var(--border-color);
            border-radius: 7px;
            padding: 6px 8px;
            background: var(--bg-secondary);
            color: var(--text-secondary);
            font-size: 13px;
            font-family: inherit;
            cursor: pointer;
            outline: none;
    }

        /* 总览模式：隐藏单日导航（区间视图里「某一天」没有意义） */
        .daily-container.overview-mode .daily-nav,
        .daily-container.overview-mode .daily-date-title,
        .daily-container.overview-mode .daily-date-picker,
        .daily-container.overview-mode #dailyToday { display: none; }

        .daily-overview-title {
            display: none;
            font-size: 17px;
            font-weight: 700;
            color: var(--text-primary);
            padding: 0 4px;
        }
        .daily-container.overview-mode .daily-overview-title { display: block; }

        .daily-header-right {
            margin-left: auto;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .daily-save-hint {
            font-size: 12px;
            color: var(--text-muted);
            opacity: 0;
            transition: opacity 0.2s;
        }
        .daily-save-hint.visible { opacity: 1; }

        .daily-btn {
            padding: 7px 12px;
            border: 1px solid var(--border-color);
            border-radius: 7px;
            background: var(--bg-secondary);
            color: var(--text-secondary);
            font-size: 13px;
            font-family: inherit;
            cursor: pointer;
            transition: background 0.15s, color 0.15s, border-color 0.15s;
        }
        .daily-btn:hover { background: var(--bg-hover); }
        .daily-btn.active {
            background: var(--accent-color);
            border-color: var(--accent-color);
            color: #fff;
        }

        .daily-body {
            flex: 1;
            overflow-y: auto;
            padding: 24px 32px 80px;
        }

        .daily-sections { max-width: 760px; margin: 0 auto; }

        .daily-section { margin-bottom: 28px; }

        .daily-section-head {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 8px;
        }

        .daily-section-title {
            border: none;
            outline: none;
            background: transparent;
            font-size: 15px;
            font-weight: 650;
            color: var(--text-primary);
            font-family: inherit;
            padding: 2px 4px;
            border-radius: 5px;
            width: 100%;
            max-width: 320px;
        }
        .daily-section-title:hover { background: var(--bg-hover); }
        .daily-section-title:focus { background: var(--bg-hover); }

        .daily-items { display: flex; flex-direction: column; gap: 1px; }

        .daily-item {
            display: flex;
            align-items: center;
            gap: 9px;
            padding: 5px 6px;
            border-radius: 6px;
            transition: background 0.12s;
        }
        .daily-item:hover { background: var(--bg-hover); }

        /* 自定义 checkbox：默认外观在暗色主题下会变成纯白块，所以自己画 */
        .daily-item-check {
            appearance: none;
            -webkit-appearance: none;
            width: 15px;
            height: 15px;
            flex-shrink: 0;
            cursor: pointer;
            border: 1.5px solid var(--checkbox-border);
            border-radius: 4px;
            background: transparent;
            position: relative;
            transition: background 0.12s, border-color 0.12s;
            margin-top: 4px;
        }
        .daily-item-check:hover { border-color: var(--accent-color); }
        .daily-item-check:checked {
            background: var(--accent-color);
            border-color: var(--accent-color);
        }
        .daily-item-check:checked::after {
            content: '';
            position: absolute;
            left: 4.2px;
            top: 1.2px;
            width: 3.5px;
            height: 7px;
            border: solid #fff;
            border-width: 0 1.8px 1.8px 0;
            transform: rotate(45deg);
        }
        .daily-item-check:focus-visible {
            outline: 2px solid var(--accent-color);
            outline-offset: 1px;
        }

        .daily-item-input {
            flex: 1;
            border: none;
            outline: none;
            background: transparent;
            font-size: 14px;
            line-height: 1.6;
            color: var(--text-primary);
            font-family: inherit;
            padding: 2px 0;
        }
        .daily-item-input::placeholder { color: var(--text-muted); }

        .daily-item.checked .daily-item-input {
            color: var(--text-muted);
            text-decoration: line-through;
        }

        .daily-item-del {
            border: none;
            background: none;
            color: var(--text-muted);
            font-size: 16px;
            line-height: 1;
            cursor: pointer;
            padding: 2px 6px;
            border-radius: 5px;
            opacity: 0;
            transition: opacity 0.12s, background 0.12s;
        }
        .daily-item:hover .daily-item-del { opacity: 1; }
        .daily-item-del:hover { background: var(--bg-active); color: var(--danger-color); }

        .daily-textarea {
            display: block;
            width: 100%;
            min-height: 84px;
            resize: none;
            border: none;
            outline: none;
            background: transparent;
            font-family: inherit;
            font-size: 14px;
            line-height: 1.75;
            color: var(--text-primary);
            padding: 4px 6px;
            border-radius: 6px;
            transition: background 0.12s;
        }
        .daily-textarea:hover { background: var(--bg-hover); }
        .daily-textarea:focus { background: var(--bg-hover); }
        .daily-textarea::placeholder { color: var(--text-muted); }

        .daily-add {
            border: none;
            background: none;
            color: var(--text-muted);
            font-size: 13px;
            font-family: inherit;
            cursor: pointer;
            padding: 6px 8px;
            border-radius: 6px;
            opacity: 0;
            transition: opacity 0.15s, background 0.15s;
        }
        .daily-section:hover .daily-add,
        .daily-sections.is-empty .daily-add { opacity: 1; }
        .daily-add:hover { background: var(--bg-hover); color: var(--text-secondary); }

        /* 总览表 */
        .daily-overview { max-width: 100%; margin: 0 auto; }

        .daily-range {
            display: flex;
            align-items: center;
            gap: 6px;
            margin-bottom: 16px;
            flex-wrap: wrap;
        }

        .daily-empty-toggle {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            margin-left: auto;
            font-size: 12px;
            color: var(--text-muted);
            cursor: pointer;
            user-select: none;
        }
        .daily-empty-toggle input {
            width: 13px;
            height: 13px;
            cursor: pointer;
            accent-color: var(--accent-color);
            margin: 0;
        }

        .daily-range-btn {
            padding: 6px 12px;
            border: 1px solid var(--border-color);
            border-radius: 7px;
            background: var(--bg-secondary);
            color: var(--text-secondary);
            font-size: 12px;
            font-family: inherit;
            cursor: pointer;
            transition: background 0.15s;
        }
        .daily-range-btn:hover { background: var(--bg-hover); }
        .daily-range-btn.active {
            background: var(--accent-color);
            border-color: var(--accent-color);
            color: #fff;
        }

        .daily-table-wrap {
            border: 1px solid var(--border-color);
            border-radius: 10px;
            overflow: hidden;
        }

        .daily-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
        }

        .daily-table th {
            text-align: left;
            padding: 10px 12px;
            background: var(--bg-primary);
            color: var(--text-secondary);
            font-weight: 600;
            font-size: 12px;
            border-bottom: 1px solid var(--border-color);
            white-space: nowrap;
        }

        .daily-table td {
            padding: 10px 12px;
            border-bottom: 1px solid var(--border-color);
            vertical-align: top;
            color: var(--text-primary);
        }

        .daily-table tr:last-child td { border-bottom: none; }

        .daily-table tbody tr {
            cursor: pointer;
            transition: background 0.12s;
        }
        .daily-table tbody tr:hover { background: var(--bg-hover); }
        .daily-table tr.no-data td { color: var(--text-muted); }
        .daily-table tr.no-data .ov-date { color: var(--text-muted); }

        .daily-table .col-date { width: 96px; white-space: nowrap; }

        .ov-date { font-weight: 600; font-size: 13px; }
        .ov-weekday-row { margin-top: 1px; }
        .ov-weekday { font-size: 11px; font-weight: 600; }

        .ov-item {
            display: flex;
            gap: 5px;
            line-height: 1.5;
            margin-bottom: 3px;
        }
        .ov-item .ov-mark {
            color: var(--accent-color);
            flex-shrink: 0;
            font-weight: 700;
        }
        .ov-item.checked .ov-mark { color: var(--success-color, #2e9e5b); }
        .ov-item.checked .ov-text {
            color: var(--text-muted);
            text-decoration: line-through;
        }

        .ov-more { font-size: 11px; color: var(--text-muted); margin-top: 3px; }

        .ov-text-block {
            font-size: 12.5px;
            line-height: 1.6;
            color: var(--text-primary);
            max-width: 320px;
        }

        .cell-empty { color: var(--text-muted); }

        .daily-ov-empty {
            text-align: center;
            padding: 40px 0;
            color: var(--text-muted);
            font-size: 13px;
        }

        @media (max-width: 768px) {
            .daily-header { padding: 10px 12px; gap: 6px; }
            .daily-date-title { font-size: 15px; min-width: auto; }
            .daily-body { padding: 16px 12px 60px; }
            .daily-date-picker { display: none; }
            .daily-table-wrap { overflow-x: auto; }
            .daily-table { min-width: 620px; }
        }

        .editor-header {
            padding: 12px 24px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
        }

        .editor-title-input {
            flex: 1;
            font-size: 20px;
            font-weight: 700;
            border: none;
            outline: none;
            background: transparent;
            color: var(--text-primary);
        }
        .editor-title-input::placeholder { color: var(--text-muted); }

        .btn-icon {
            background: transparent;
            border: none;
            padding: 8px;
            border-radius: 6px;
            cursor: pointer;
            color: var(--text-secondary);
            transition: all 0.15s ease;
            flex-shrink: 0;
        }
        .btn-icon:hover { background: var(--bg-hover); color: var(--danger-color); }

        .btn-back { display: none; }
        .btn-back:hover { color: var(--accent-color); }

        .editor-content {
            flex: 1;
            overflow-y: auto;
            padding: 24px 32px;
        }

        .editor-wrapper {
            display: flex;
            flex-direction: column;
            flex: 1;
            overflow: hidden;
        }

        .save-indicator {
            font-size: 12px;
            color: var(--text-muted);
            white-space: nowrap;
            flex-shrink: 0;
        }
        .save-indicator.saving { color: var(--accent-color); }
        .save-indicator.saved { color: #27ae60; }

        .online-count {
            font-size: 12px;
            color: var(--accent-color);
            white-space: nowrap;
            flex-shrink: 0;
        }

        .empty-state {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: var(--text-muted);
        }
        .empty-state-icon { font-size: 56px; margin-bottom: 16px; opacity: 0.3; }
        .empty-state-text { font-size: 16px; margin-bottom: 8px; }
        .empty-state-hint { font-size: 14px; }

        .sidebar-empty {
            padding: 20px;
            text-align: center;
            color: var(--text-muted);
            font-size: 14px;
        }

        .search-box { padding: 0 20px 12px; }
        .search-input {
            width: 100%;
            padding: 8px 12px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            font-size: 14px;
            outline: none;
            background: var(--bg-primary);
            color: var(--text-primary);
            transition: border-color 0.2s;
        }
        .search-input:focus { border-color: var(--accent-color); }

        mark {
            background: #fff176;
            color: inherit;
            border-radius: 2px;
            padding: 0 1px;
        }

        [data-theme="dark"] mark { background: #9e6a03; color: #d4d4d4; }

        .toast {
            position: fixed;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%);
            background: #333;
            color: #fff;
            padding: 12px 20px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            gap: 16px;
            font-size: 14px;
            box-shadow: 0 4px 16px rgba(0,0,0,0.2);
            z-index: 1000;
            animation: slideUp 0.2s ease;
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateX(-50%) translateY(8px); }
            to   { opacity: 1; transform: translateX(-50%) translateY(0); }
        }

        /* Login Screen */
        .login-screen {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: var(--bg-primary);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 9999;
        }

        .login-screen.hidden { display: none; }

        .login-box {
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 40px;
            width: 360px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.1);
        }

        .login-title {
            font-size: 24px;
            font-weight: 700;
            text-align: center;
            margin-bottom: 8px;
            color: var(--text-primary);
        }

        .login-subtitle {
            font-size: 14px;
            color: var(--text-muted);
            text-align: center;
            margin-bottom: 32px;
        }

        .login-form { display: flex; flex-direction: column; gap: 16px; }

        .login-input {
            padding: 12px 16px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            font-size: 14px;
            background: var(--bg-primary);
            color: var(--text-primary);
            outline: none;
            transition: border-color 0.2s;
        }

        .login-input:focus { border-color: var(--accent-color); }

        .login-btn {
            padding: 12px 16px;
            background: var(--accent-color);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }

        .login-btn:hover { background: var(--accent-hover); }

        .login-error {
            color: var(--danger-color);
            font-size: 13px;
            text-align: center;
            display: none;
        }

        .toast-undo {
            background: transparent;
            border: 1px solid rgba(255,255,255,0.5);
            color: #fff;
            padding: 4px 10px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 13px;
        }
        .toast-undo:hover { background: rgba(255,255,255,0.15); }

        /* Tiptap Editor Styles */
        .tiptap-editor {
            outline: none;
            font-size: 16px;
            line-height: 1.75;
            color: var(--text-primary);
        }

        .ProseMirror {
            outline: none;
        }

        .ProseMirror p { margin-bottom: 0.5em; }
        .tiptap-editor p.is-editor-empty:first-child::before {
            content: attr(data-placeholder);
            float: left;
            color: var(--text-muted);
            pointer-events: none;
            height: 0;
        }

        .tiptap-editor h1 { font-size: 1.8em; font-weight: 700; margin: 0.8em 0 0.4em; }
        .tiptap-editor h2 { font-size: 1.5em; font-weight: 700; margin: 0.7em 0 0.3em; }
        .tiptap-editor h3 { font-size: 1.25em; font-weight: 600; margin: 0.6em 0 0.3em; }

        .tiptap-editor ul, .tiptap-editor ol { padding-left: 1.5em; margin-bottom: 0.5em; }
        .tiptap-editor li { margin-bottom: 0.2em; }

        /* 待办清单 */
        .tiptap-editor ul[data-type="taskList"] {
            list-style: none;
            padding-left: 0.2em;
        }
        .tiptap-editor ul[data-type="taskList"] li {
            display: flex;
            align-items: flex-start;
            gap: 0.5em;
        }
        .tiptap-editor ul[data-type="taskList"] li > label {
            flex: 0 0 auto;
            display: flex;
            align-items: center;
            height: 1.75em; /* 与 .tiptap-editor 的 line-height 一致，保证与首行文字垂直居中 */
            margin: 0;
            user-select: none;
        }
        .tiptap-editor ul[data-type="taskList"] li > label > input[type="checkbox"] {
            width: 15px;
            height: 15px;
            margin: 0;
            cursor: pointer;
            accent-color: var(--accent-color);
        }
        .tiptap-editor ul[data-type="taskList"] li > div {
            flex: 1 1 auto;
            min-width: 0;
        }
        .tiptap-editor ul[data-type="taskList"] li > div > p {
            margin: 0;
        }
        /* 勾选后划掉内容 */
        .tiptap-editor ul[data-type="taskList"] li[data-checked="true"] > div {
            opacity: 0.55;
            text-decoration: line-through;
        }
        /* 嵌套的待办清单缩进 */
        .tiptap-editor ul[data-type="taskList"] ul[data-type="taskList"] {
            margin: 0.2em 0 0;
        }

        .tiptap-editor blockquote {
            border-left: 3px solid var(--blockquote-border);
            background: var(--blockquote-bg);
            padding: 8px 16px;
            margin: 0.5em 0;
            border-radius: 0 4px 4px 0;
        }

        .tiptap-editor code {
            background: var(--code-bg);
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 0.9em;
            font-family: 'SF Mono', 'Monaco', 'Inconsolata', 'Fira Code', monospace;
        }

        .tiptap-editor pre {
            background: var(--code-bg);
            padding: 16px;
            border-radius: 8px;
            margin: 0.5em 0;
            overflow-x: auto;
        }
        .tiptap-editor pre code {
            background: none;
            padding: 0;
            font-size: 0.9em;
        }

        .tiptap-editor img {
            max-width: 100%;
            height: auto;
            border-radius: 8px;
            margin: 0.5em 0;
            display: block;
            loading: lazy;
        }

        .tiptap-editor hr {
            border: none;
            border-top: 2px solid var(--border-color);
            margin: 1em 0;
        }

        .tiptap-editor strong { font-weight: 700; }
        .tiptap-editor em { font-style: italic; }
        .tiptap-editor u { text-decoration: underline; }
        .tiptap-editor s { text-decoration: line-through; }

        /* Collaboration Cursor */
        .collaboration-cursor__caret {
            border-left: 1px solid #0d0d0d;
            border-right: 1px solid #0d0d0d;
            margin-left: -1px;
            margin-right: -1px;
            pointer-events: none;
            position: relative;
            word-break: normal;
        }

        .collaboration-cursor__label {
            border-radius: 3px 3px 3px 0;
            color: #fff;
            font-size: 11px;
            font-weight: 600;
            left: -1px;
            line-height: normal;
            padding: 2px 6px;
            position: absolute;
            top: -1.4em;
            user-select: none;
            white-space: nowrap;
        }

        /* Bubble Menu */
        .bubble-menu {
            background: var(--toolbar-bg);
            border: 1px solid var(--toolbar-border);
            border-radius: 8px;
            box-shadow: 0 2px 12px var(--toolbar-shadow);
            display: flex;
            padding: 4px;
            gap: 2px;
            position: absolute;
            z-index: 100;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.15s, visibility 0.15s;
        }

        .bubble-menu.is-active {
            opacity: 1;
            visibility: visible;
        }

        .bubble-menu button {
            background: none;
            border: none;
            border-radius: 4px;
            color: var(--text-primary);
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
            padding: 6px 8px;
            transition: background 0.15s;
            white-space: nowrap;
        }
        .bubble-menu button:hover { background: var(--bg-hover); }
        .bubble-menu button.is-active { background: var(--accent-color); color: #fff; }

        .bubble-menu .separator {
            width: 1px;
            background: var(--border-color);
            margin: 4px 2px;
        }

        @media (max-width: 768px) {
            :root { --sidebar-width: 100%; }
            .app { flex-direction: column; }
            .sidebar {
                width: 100%;
                height: auto;
                max-height: 100vh;
                border-right: none;
                border-bottom: 1px solid var(--border-color);
                flex-shrink: 0;
            }
            .app.editor-active .sidebar { display: none; }
            .app.editor-active .editor-container { display: flex; }
            .editor-container { display: none; }
            .app.daily-mode .sidebar { display: none; }
            .app.daily-mode .daily-container { display: flex; }
            .app.daily-mode .editor-container { display: none; }
            .daily-back-btn { display: inline-flex !important; }
            .btn-back { display: inline-flex; }
            .note-item-preview { display: none; }
            .editor-content { padding: 16px; }
        }
    </style>
</head>
<body>
    <div class="login-screen" id="loginScreen">
        <div class="login-box">
            <div class="login-title">轻记</div>
            <div class="login-subtitle">请先登录再使用笔记</div>
            <form class="login-form" id="loginForm">
                <input type="text" class="login-input" id="loginUsername" placeholder="用户名" autocomplete="username">
                <input type="password" class="login-input" id="loginPassword" placeholder="密码" autocomplete="current-password">
                <button type="submit" class="login-btn">登录</button>
                <div class="login-error" id="loginError"></div>
            </form>
        </div>
    </div>

    <div class="app" id="app">
        <aside class="sidebar">
            <div class="sidebar-header">
                <h1 class="app-title">轻记</h1>
                <button class="dark-toggle" id="darkToggle" title="切换暗色模式">🌙</button>
            </div>
            <div class="view-switch">
                <button class="view-switch-btn active" id="viewNotesBtn">笔记</button>
                <button class="view-switch-btn" id="viewDailyBtn">日报</button>
            </div>
            <!-- 笔记模式 -->
            <div class="sidebar-pane" id="notesPane">
                <div class="sidebar-actions">
                    <button class="btn btn-primary" id="newNoteBtn">
                        <span>+</span> 新建笔记
                    </button>
                </div>
                <div class="search-box">
                    <input type="text" class="search-input" id="searchInput" placeholder="搜索笔记...">
                </div>
                <div class="notes-list" id="notesList"></div>
            </div>
            <!-- 日报模式：列出有记录的日期 -->
            <div class="sidebar-pane hidden" id="dailyPane">
                <div class="sidebar-actions">
                    <button class="btn btn-primary" id="dailyJumpToday">
                        <span>+</span> 写今天
                    </button>
                </div>
                <div class="sidebar-subtitle">有记录的日期</div>
                <div class="daily-date-list" id="dailyDateList"></div>
            </div>
        </aside>
        <main class="daily-container hidden" id="dailyContainer">
            <div class="daily-header">
                <button class="daily-back-btn" id="dailyBack" title="返回列表">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M15 18l-6-6 6-6"/>
                    </svg>
                </button>
                <div class="daily-nav">
                    <button class="daily-nav-btn" id="dailyPrev" title="前一天">‹</button>
                    <button class="daily-nav-btn" id="dailyNext" title="后一天">›</button>
                </div>
                <div class="daily-date-title" id="dailyDateTitle"></div>
                <div class="daily-overview-title">总览</div>
                <input type="date" class="daily-date-picker" id="dailyPickDate">
                <div class="daily-header-right">
                    <span class="daily-save-hint" id="dailySaveHint"></span>
                    <button class="daily-btn" id="dailyToday">今天</button>
                    <button class="daily-btn" id="dailyOverviewBtn">总览</button>
                </div>
            </div>
            <div class="daily-body">
                <div class="daily-sections is-empty" id="dailySections"></div>
                <div class="daily-overview hidden" id="dailyOverview">
                    <div class="daily-range">
                        <button class="daily-range-btn" data-days="7">最近 7 天</button>
                        <button class="daily-range-btn active" data-days="14">最近 14 天</button>
                        <button class="daily-range-btn" data-days="30">最近 30 天</button>
                        <label class="daily-empty-toggle">
                            <input type="checkbox" id="dailyShowEmpty">
                            <span>显示空白日期</span>
                        </label>
                    </div>
                    <div class="daily-table-wrap">
                        <table class="daily-table">
                            <thead id="dailyOverviewHead"></thead>
                            <tbody id="dailyOverviewBody"></tbody>
                        </table>
                    </div>
                </div>
            </div>
        </main>
        <main class="editor-container" id="editorContainer">
            <div class="empty-state" id="emptyState">
                <div class="empty-state-icon">📝</div>
                <div class="empty-state-text">选择一个笔记开始编辑</div>
                <div class="empty-state-hint">或点击上方"新建笔记"创建新笔记</div>
            </div>
            <div class="editor-wrapper" id="editorWrapper" style="display: none; flex-direction: column; flex: 1;">
                <div class="editor-header">
                    <button class="btn-icon btn-back" id="backBtn" title="返回列表">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M15 18l-6-6 6-6"/>
                        </svg>
                    </button>
                    <input type="text" class="editor-title-input" id="noteTitle" placeholder="无标题笔记">
                    <span class="save-indicator" id="saveIndicator"></span>
                    <span id="onlineCount" class="online-count"></span>
                    <button class="btn-icon" id="scrollBottomBtn" title="跳到底部">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M12 5v14M5 12l7 7 7-7"/>
                        </svg>
                    </button>
                    <button class="btn-icon" id="deleteNoteBtn" title="删除笔记">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M3 6h18M19 6v14a2 2 0 01-2 2H7a2 2 0 01-2-2V6m3 0V4a2 2 0 012-2h4a2 2 0 012 2v2"/>
                        </svg>
                    </button>
                </div>
                <div class="editor-content" id="editorContent"></div>
            </div>
        </main>
    </div>

    <div class="bubble-menu" id="bubbleMenu">
        <button data-action="bold" title="粗体"><b>B</b></button>
        <button data-action="italic" title="斜体"><i>I</i></button>
        <button data-action="underline" title="下划线"><u>U</u></button>
        <button data-action="strike" title="删除线"><s>S</s></button>
        <button data-action="code" title="行内代码">&lt;&gt;</button>
        <div class="separator"></div>
        <button data-action="h2" title="标题2">H2</button>
        <button data-action="h3" title="标题3">H3</button>
        <div class="separator"></div>
        <button data-action="bulletList" title="无序列表">• 列表</button>
        <button data-action="orderedList" title="有序列表">1. 列表</button>
        <button data-action="blockquote" title="引用">❝</button>
        <button data-action="codeBlock" title="代码块">{ }</button>
    </div>

    <script type="module" src="/chunks/vendor-N-wLZhEj.js"></script>
    <script type="module" src="/chunks/client-DByPF0ge.js"></script>
</body>
</html>
